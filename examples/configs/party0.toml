# Stoffel Network Configuration - Party 0
# This configuration file defines how this party connects to the MPC network

[network]
# This party's unique identifier (0 to n_parties-1)
party_id = 0

# Address to bind for incoming connections from other parties
bind_address = "127.0.0.1:9001"

# Bootnode address for party discovery
# All parties connect to the bootnode to discover each other
bootstrap_address = "127.0.0.1:9000"

# Minimum number of parties required before starting computation
# Computation won't begin until this many parties have joined
min_parties = 3

[mpc]
# Total number of MPC parties in the network
n_parties = 5

# Fault tolerance threshold
# The protocol can tolerate up to 't' faulty parties
# Requirement: n_parties >= 3 * threshold + 1
threshold = 1

# Optional: Instance ID for this computation
# If not set, a random ID will be generated
instance_id = 12345
