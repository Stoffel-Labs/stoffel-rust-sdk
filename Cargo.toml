[package]
name = "stoffel-rust-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Stoffel Labs"]
description = "A friendly Rust SDK for the Stoffel ecosystem (Stoffel-Lang, StoffelVM, and MPC protocols)"
license = "Apache-2.0"
repository = "https://github.com/Stoffel-Labs/stoffel-rust-sdk"

[dependencies]
# Core Stoffel dependencies (pinned to specific commits)
stoffellang = { git = "https://github.com/Stoffel-Labs/Stoffel-Lang.git", rev = "1c0bdde58b1ca3e995b28f223fcefc484f1a87fb" }
# StoffelVM: feature/coordinator-client branch - has ClientStore.get_number_clients
stoffel-vm = { git = "https://github.com/Stoffel-Labs/StoffelVM.git", rev = "4b202de" }
stoffel-vm-types = { git = "https://github.com/Stoffel-Labs/StoffelVM.git", rev = "4b202de" }
# mpc-protocols: feature/asymmetric-bad-fake-network branch - has race condition fixes
stoffelmpc-mpc = { git = "https://github.com/Stoffel-Labs/mpc-protocols.git", rev = "e29533c" }
stoffelmpc-network = { git = "https://github.com/Stoffel-Labs/mpc-protocols.git", rev = "e29533c" }

# Modern QUIC-based networking (pinned to match mpc-protocols)
stoffelnet = { git = "https://github.com/Stoffel-Labs/stoffel-networking.git", rev = "bac0841120d7e99f6be867a00dd3c38a6fc5f126" }

# Utility dependencies
anyhow = "1.0"
thiserror = "1.0"
ordered-float = "4.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
toml = "0.8"

# MPC dependencies
ark-bls12-381 = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["std"] }
rand = "0.8"

# Async runtime for MPC operations
tokio = { version = "1.0", features = ["full"] }
futures = { version = "0.3" }

# Cryptography for QUIC
rustls = { version = "0.23", features = ["ring"] }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []

[[example]]
name = "honeybadger_mpc_demo"
path = "examples/honeybadger_mpc_demo.rs"
