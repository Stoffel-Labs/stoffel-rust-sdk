[package]
name = "stoffel-rust-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Stoffel Labs"]
description = "A friendly Rust SDK for the Stoffel ecosystem (Stoffel-Lang, StoffelVM, and MPC protocols)"
license = "Apache-2.0"
repository = "https://github.com/Stoffel-Labs/stoffel-rust-sdk"

[dependencies]
# Core Stoffel dependencies (local paths, repos on correct branches)
stoffellang = { path = "../../Stoffel-Lang" }
stoffel-vm = { path = "../../StoffelVM/crates/stoffel-vm" }
stoffel-vm-types = { path = "../../StoffelVM/crates/stoffel-vm-types" }
stoffelmpc-mpc = { path = "../../mpc-protocols/mpc" }
stoffelmpc-network = { path = "../../mpc-protocols/network" }
stoffelnet = { path = "../../stoffel-networking" }
stoffel-mpc-coordinator = { path = "../../stoffel-mpc-coordinator" }

# Utility dependencies
anyhow = "1.0"
thiserror = "1.0"
ordered-float = "4.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# MPC dependencies
ark-bls12-381 = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["std"] }
rand = "0.8"

# Async runtime for MPC operations
tokio = { version = "1.0", features = ["full"] }
futures = { version = "0.3" }

# Cryptography for QUIC
rustls = { version = "0.23", features = ["ring"] }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []


