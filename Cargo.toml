[package]
name = "stoffel-rust-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Stoffel Labs"]
description = "A friendly Rust SDK for the Stoffel ecosystem (Stoffel-Lang, StoffelVM, and MPC protocols)"
license = "Apache-2.0"
repository = "https://github.com/Stoffel-Labs/stoffel-rust-sdk"

[dependencies]
# Core Stoffel dependencies (pinned to feature branches)
stoffellang = { git = "https://github.com/Stoffel-Labs/Stoffel-Lang.git", branch = "feature/adkg-compatibility" }
stoffel-vm = { git = "https://github.com/Stoffel-Labs/StoffelVM.git", branch = "adkg-implementation" }
stoffel-vm-types = { git = "https://github.com/Stoffel-Labs/StoffelVM.git", branch = "adkg-implementation" }
stoffelmpc-mpc = { git = "https://github.com/Stoffel-Labs/mpc-protocols.git", branch = "dev" }
stoffelmpc-network = { git = "https://github.com/Stoffel-Labs/mpc-protocols.git", branch = "dev" }
stoffelnet = { git = "https://github.com/Stoffel-Labs/stoffel-networking.git", branch = "feature/client-and-node-list-consensus" }
stoffel-mpc-coordinator = { git = "https://github.com/Stoffel-Labs/stoffel-mpc-coordinator.git", branch = "feature/submit-program-trait" }

# Utility dependencies
anyhow = "1.0"
thiserror = "1.0"
ordered-float = "4.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# MPC dependencies
ark-bls12-381 = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["std"] }
rand = "0.8"

# Async runtime for MPC operations
tokio = { version = "1.0", features = ["full"] }
futures = { version = "0.3" }

# Cryptography for QUIC
rustls = { version = "0.23", features = ["ring"] }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []


