[package]
name = "stoffel-rust-sdk"
version = "0.1.0"
edition = "2021"
authors = ["Stoffel Labs"]
description = "A friendly Rust SDK for the Stoffel ecosystem (Stoffel-Lang, StoffelVM, and MPC protocols)"
license = "Apache-2.0"
repository = "https://github.com/Stoffel-Labs/stoffel-rust-sdk"

[dependencies]
# Core Stoffel dependencies (using git submodules for version pinning)
stoffellang = { path = "external/stoffel-lang" }
stoffel-vm = { path = "external/stoffel-vm/crates/stoffel-vm" }
stoffel-vm-types = { path = "external/stoffel-vm/crates/stoffel-vm-types" }
stoffelmpc-mpc = { path = "external/mpc-protocols/mpc" }
stoffelmpc-network = { path = "external/mpc-protocols/network" }

# Modern QUIC-based networking
stoffelnet = { path = "external/stoffel-networking" }

# Utility dependencies
anyhow = "1.0"
thiserror = "1.0"
ordered-float = "4.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
toml = "0.8"

# MPC dependencies
ark-bls12-381 = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["std"] }
rand = "0.8"

# Async runtime for MPC operations
tokio = { version = "1.0", features = ["full"] }
futures = { version = "0.3" }

# Cryptography for QUIC
rustls = { version = "0.23", features = ["ring"] }

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }

[features]
default = []

# Ensure all dependencies use the same local version of stoffelnet and mpc-protocols
[patch."https://github.com/Stoffel-Labs/stoffel-networking.git"]
stoffelnet = { path = "external/stoffel-networking" }

[patch."https://github.com/Stoffel-Labs/mpc-protocols.git"]
stoffelmpc-mpc = { path = "external/mpc-protocols/mpc" }

[patch."https://github.com/Stoffel-Labs/StoffelVM.git"]
stoffel-vm-types = { path = "external/stoffel-vm/crates/stoffel-vm-types" }

[[example]]
name = "bytecode_execution"
path = "examples/bytecode_execution.rs"

[[example]]
name = "complete_mpc_workflow"
path = "examples/complete_mpc_workflow.rs"

[[example]]
name = "mpc_computation"
path = "examples/mpc_computation.rs"

[[example]]
name = "simple_mpc_network"
path = "examples/simple_mpc_network.rs"

[[example]]
name = "mpc_e2e"
path = "examples/mpc_e2e.rs"

[[example]]
name = "mpcaas_client"
path = "examples/mpcaas_client.rs"

[[example]]
name = "mpcaas_server"
path = "examples/mpcaas_server.rs"

[[example]]
name = "honeybadger_mpc_demo"
path = "examples/honeybadger_mpc_demo.rs"
